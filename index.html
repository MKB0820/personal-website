<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MKB — 终端个人主页</title>
    <meta name="description" content="MKB · 北京中学高中生 / 全栈工程师的终端风格个人主页。输入 help 开始探索。" />
    <meta name="author" content="MKB" />
    <meta name="theme-color" content="#0a0e14" />
    <script>
      // 首屏绘制前应用已保存的主题，避免绿色→其它主题的闪烁
      try {
        var t = localStorage.getItem('mkb-theme')
        if (t === 'green' || t === 'cyan' || t === 'amber') {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {
        /* 隐私模式下忽略 */
      }
    </script>
    <meta property="og:title" content="MKB — 终端个人主页" />
    <meta property="og:description" content="欢迎来到 MKB 的终端。输入 help 开始探索。" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
